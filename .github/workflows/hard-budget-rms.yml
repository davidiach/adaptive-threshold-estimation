name: Hard-budget RMS checks
on:
  push:
    paths:
      - '.github/workflows/hard-budget-rms.yml'
      - 'toolkit/threshold_toolkit/budget_ladders.py'
      - 'toolkit/tests/test_budget_ladders.py'
      - 'research/2026-10-30-hard-budget-rms/**'
  pull_request:
    paths:
      - '.github/workflows/hard-budget-rms.yml'
      - 'toolkit/threshold_toolkit/budget_ladders.py'
      - 'toolkit/tests/test_budget_ladders.py'
      - 'research/2026-10-30-hard-budget-rms/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fallback:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s toolkit/tests -p 'test_budget_ladders.py' -v
      - run: python research/2026-10-30-hard-budget-rms/verify.py
