name: Toolkit tests
on:
  push:
    paths:
      - '.github/workflows/toolkit.yml'
      - 'toolkit/**'
  pull_request:
    paths:
      - '.github/workflows/toolkit.yml'
      - 'toolkit/**'
  workflow_dispatch:
concurrency:
  group: toolkit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  toolkit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: python -m pip install ./toolkit
      - name: Unit tests
        run: python -m unittest discover -s toolkit/tests -v
      - name: Example and installed command
        run: |
          python toolkit/examples/quickstart.py
          cd "$RUNNER_TEMP"
          python -m threshold_toolkit --rates 0.9,0.6,0.55,0.3 --budget 2000 --runs 20
