          for attempt in 1 2 3; do
            if curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh" \
                && sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none; then
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Download pinned Mathlib cache
        working-directory: lean
        run: |
          for attempt in 1 2 3; do
            if lake exe cache get; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
      # Pull requests reuse the project's compiled modules from earlier runs of
      # this job on the same branch or on main. Lake still rebuilds every module
      # whose source, imports or toolchain changed: its traces hash them. Pushes
      # to main and manual runs build from scratch and refresh the cache. Lake's
      # per-module setup files, about 9 GB, are left out; it does not need them
      # to reuse a module.
      - name: Compute the build cache key
        id: build-key
        run: |
          echo "prefix=lean-build-v1-${{ github.job }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}-" >> "$GITHUB_OUTPUT"
          echo "sources=${{ hashFiles('lean/ThresholdHC.lean', 'lean/ThresholdHC/**/*.lean') }}" >> "$GITHUB_OUTPUT"
      - name: Restore compiled project modules
        id: build-cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: |
            lean/.lake/build
            !lean/.lake/build/ir/**/*.setup.json
          key: ${{ steps.build-key.outputs.prefix }}${{ steps.build-key.outputs.sources }}
          restore-keys: ${{ steps.build-key.outputs.prefix }}
      - name: Build the stopping-program, cap-identification and genie modules
        working-directory: lean
        run: lake build ThresholdHC.StoppingProgram.BellmanTheorem ThresholdHC.StoppingProgram.FiniteCertificate ThresholdHC.CapIdentification.FiniteSeparation ThresholdHC.CapIdentification.Full ThresholdHC.Genie.AtomConicRealization ThresholdHC.Genie.DirectRisk ThresholdHC.Genie.InfiniteDivergenceExample ThresholdHC.Genie.OptimizedConvergence
      - name: Audit the stopping-program, cap-identification and genie theorems
        run: |
          for audit in stopping_components stopping_flow_mixture finite_stopping_program rarity_support stopping_dual information_bellman reference_absorption ordered_information adaptive_information stopping_program_upper finite_risk_certificate infinite_cap_dual genie_brackets genie_convergence genie_conic genie_counterexample; do
            echo "::group::verify_${audit}.py"
            python tools/verify_${audit}.py --cached-dependencies
            echo "::endgroup::"
          done
      # Delta_N / 2 >= rho ||h||_2^2 / (4 ||h||_inf), the explicit estimate after
      # the fixed-cap identification theorem.
      - name: Verify the explicit fixed-cap estimate and replay its modules
        run: python tools/verify_cap_identification_estimate.py --replay --jobs 3
      # The rms-constants review: R <= P_inf <= (3 sqrt 7 / 2) R, and with a cap of
      # at least 4B/9 the factor 3 sqrt 7 < 8 for the program and the genie test.
      - name: Verify the stopping-program factor 3 sqrt 7 / 2 and replay its modules
        run: python tools/verify_program_factor.py --replay --jobs 3
      - name: Verify uniform convergence of the optimized cap programs
        run: python tools/verify_genie_rate.py
      - name: Verify square-root convergence of the ordinary cap program
        run: python tools/verify_finite_cap_truncation.py
      - name: Verify the square-root cap comparison of the optimized programs
        run: python tools/verify_square_root_cap.py
      # Lake builds only the reused dependencies; the 57 registered modules are
      # compiled once, natively, by the audit itself.
      - name: Build dependencies and audit supporting entropy-tail lower lemmas
        run: python tools/verify_entropy_tail_lower_components.py --cached-dependencies --build-dependencies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stopping-program-verification
          include-hidden-files: true
          path: |
            .runtime/stopping-components/
            .runtime/stopping-flow-mixture/
            .runtime/finite-stopping-program/
            .runtime/rarity-support/
            .runtime/stopping-dual/
            .runtime/information-bellman/
            .runtime/reference-absorption/
            .runtime/ordered-information/
            .runtime/adaptive-information/
            .runtime/stopping-program-upper/
            .runtime/finite-risk-certificate/
            .runtime/infinite-cap-dual/
            .runtime/genie-brackets/
            .runtime/genie-convergence/
            .runtime/genie-conic/
            .runtime/genie-counterexample/
            .runtime/entropy-tail-lower-components/
      - name: Save compiled project modules
        if: success() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lean/.lake/build
            !lean/.lake/build/ir/**/*.setup.json
          key: ${{ steps.build-key.outputs.prefix }}${{ steps.build-key.outputs.sources }}
