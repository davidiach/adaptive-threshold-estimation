name: Reproducible checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lean-inputs:
    runs-on: ubuntu-latest
    outputs:
      kernel: ${{ steps.select.outputs.lean-kernel }}
      modules: ${{ steps.select.outputs.lean-all-modules }}
      entropy: ${{ steps.select.outputs.entropy-tail-upper }}
      stopping: ${{ steps.select.outputs.stopping-program }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR checkout is the proposed merge. Compare its tree to its base,
          # or on main compare the entire push to the previous tip.
          fetch-depth: 0
          sparse-checkout: .github
      - run: python3 -m unittest discover -s .github -p 'test_lean_ci.py' -v
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/lean_ci.py
  research-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify research identities and replay finite diagnostics
        run: python tools/verify_research.py
      - name: Check research guard rejects tampering
        run: python -m unittest discover -s tools -p 'test_research_validation.py' -v
      - name: Verify the critical review packet matches its locked sources
        run: python tools/build_critical_review.py --check
      - name: Verify the consolidated manuscript and its inherited sources
        run: python tools/build_v5.py --check
      - name: Verify rare-event v2 identities and replay finite certificates
        run: python tools/verify_rare_event_manuscript.py
      - name: Check rare-event bracket rows bind verified certificate pairs
        run: python -m unittest discover -s tools -p 'test_rare_event_manuscript.py' -v
      - name: Check manuscript assembly preserves mathematical expressions
        run: python -m unittest discover -s tools -p 'test_build_v5.py' -v
      - name: Verify the consolidated v6 manuscript and its inherited sources
        run: python tools/build_v6.py --check
      - name: Check v6 assembly keeps both rare-event papers' proof text
        run: python -m unittest discover -s tools -p 'test_build_v6.py' -v
      - name: Check the README and results-guide status tables match status.json
        run: |
          python tools/build_status_docs.py --check
          python -m unittest discover -s tools -p 'test_build_status_docs.py' -v
      - name: Install pdfinfo for the build-record page count
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Check the current v6 build record against its PDF and sources
        run: |
          python tools/check_build_record.py --require-page-count
          python -m unittest discover -s tools -p 'test_check_build_record.py' -v
      - name: Replay population and nonlinear feedback checkpoints
        run: python tools/verify_population_research.py
      - name: Replay certified-selection evidence and compare with tracked records
        run: |
          python research/2026-10-30-certified-selection/verify_algebra.py
          python research/2026-10-30-certified-selection/reproduce.py
          python research/2026-10-30-certified-selection/integration-review/certify_obstruction.py
          python research/2026-10-30-certified-selection/integration-review/independent_check.py
          python tools/verify_quantile_price_bounds.py
          python tools/verify_optimal_quantile_factor.py
          python tools/verify_finite_cap_rate.py
      - name: Replay the exact hard-budget RMS fallback audits
        run: python research/2026-10-30-hard-budget-rms/verify.py
      - name: Replay the exact confidence-transfer and sequential-coverage audits
        run: |
          python research/2026-10-30-confidence-transfer/verify_transfer.py --output .runtime/confidence-transfer/transfer.json
          python research/2026-10-30-confidence-transfer/verify_anytime.py
  numerical-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Mark the start of the checks that rewrite published records
        run: |
          mkdir -p .runtime/drift
          touch .runtime/drift/start
          sleep 1
      - run: python tools/verify_inputs.py
      - run: python tools/verify_experiment_lock.py --strict
      - run: python benchmark/verify_real.py
      - run: python benchmark/verify_production.py
      - name: Regression tests for validation guards
        run: python -m unittest discover -s tools -p 'test_validation.py' -v
      - name: Regression tests for the Tier 3 audit
        run: python -m unittest discover -s tools -p 'test_tier3_validation.py' -v
      - name: Regression tests for the Tier 4 audit
        run: python -m unittest discover -s tools -p 'test_tier4_validation.py' -v
      - name: Regression tests for the Tier 5 audit
        run: python -m unittest discover -s tools -p 'test_tier5_validation.py' -v
      - name: Regression tests for the Tier 6 audit
        run: python -m unittest discover -s tools -p 'test_tier6_validation.py' -v
      - name: Regression tests for the scoped critical component audit
        run: python -m unittest discover -s tools -p 'test_critical_components.py' -v
      - name: Regression tests for the upper theorem audit
        run: python -m unittest discover -s tools -p 'test_blind_upper_components.py' -v
      - name: Regression tests for the critical upper component audit
        run: python -m unittest discover -s tools -p 'test_critical_upper_components.py' -v
      - name: Regression tests for the critical Psi audit
        run: python -m unittest discover -s tools -p 'test_critical_psi.py' -v
      - name: Regression tests for the all-size critical extension audit
        run: python -m unittest discover -s tools -p 'test_critical_all_sizes.py' -v
      - name: Regression tests for the unbiased converse audit
        run: python -m unittest discover -s tools -p 'test_unbiased_converse.py' -v
      - name: Regression tests for the observable 713 audit
        run: python -m unittest discover -s tools -p 'test_observable713.py' -v
      - name: Regression tests for the observable confidence audit
        run: python -m unittest discover -s tools -p 'test_confidence.py' -v
      - name: Regression tests for the entropy perturbation and compression audit
        run: python -m unittest discover -s tools -p 'test_selection_approximation.py' -v
      - name: Regression tests for the assembled finite-law approximation audit
        run: python -m unittest discover -s tools -p 'test_finite_selection_approximation.py' -v
      - name: Scan every project Lean source for proof escapes
        run: |
          python -m unittest discover -s tools -p 'test_lean_sources.py' -v
          python tools/verify_lean_sources.py
      - name: Regression tests for the magnitude-oracle lower bounds
        run: python -m unittest discover -s tools -p 'test_oracle_lower.py' -v
      - name: Regression tests for the above-two rare-event audit
        run: python -m unittest discover -s tools -p 'test_rare_above_two.py' -v
      - name: Regression tests for the entropy-tail audit
        run: python -m unittest discover -s tools -p 'test_entropy_tail.py' -v
      - name: Regression tests for the supporting entropy-tail lower audit
        run: python -m unittest discover -s tools -p 'test_entropy_tail_lower_components.py' -v
      - name: Regression tests for the closed-quantile minimax corollary
        run: python -m unittest discover -s tools -p 'test_closed_quantile.py' -v
      - name: Regression tests for the quantile-comparison audit
        run: python -m unittest discover -s tools -p 'test_quantile_comparison.py' -v
      - name: Regression tests for the direct finite-quantile audit
        run: python -m unittest discover -s tools -p 'test_finite_quantile.py' -v
      - name: Regression tests for the Psi lower-bound audit
        run: python -m unittest discover -s tools -p 'test_psi_selection.py' -v
      - name: Regression tests for the Psi closed-form audit
        run: python -m unittest discover -s tools -p 'test_psi_closed_form.py' -v
      - name: Regression tests for the Psi gap audit
        run: python -m unittest discover -s tools -p 'test_psi_gap.py' -v
      - name: Regression tests for Psi sharpness, power-window, critical-window and paper-corollary audits
        run: |
          python -m unittest discover -s tools -p 'test_psi_sharpness.py' -v
          python -m unittest discover -s tools -p 'test_power_window.py' -v
          python -m unittest discover -s tools -p 'test_critical_window.py' -v
          python -m unittest discover -s tools -p 'test_paper_corollaries.py' -v
          python -m unittest discover -s tools -p 'test_paper_statements.py' -v
          python -m unittest discover -s tools -p 'test_finite_gap_corollaries.py' -v
          python -m unittest discover -s tools -p 'test_stopped_time_uniform.py' -v
          python -m unittest discover -s tools -p 'test_latent_threshold.py' -v
          python -m unittest discover -s tools -p 'test_zero_atom_split.py' -v
          python -m unittest discover -s tools -p 'test_cap_identification_estimate.py' -v
          python -m unittest discover -s tools -p 'test_critical_pair_rms.py' -v
          python -m unittest discover -s tools -p 'test_bias_subtraction.py' -v
          python -m unittest discover -s tools -p 'test_restricted_rms.py' -v
          python -m unittest discover -s tools -p 'test_sharp_strict.py' -v
          python -m unittest discover -s tools -p 'test_global_cut.py' -v
          python -m unittest discover -s tools -p 'test_psi_null.py' -v
          python -m unittest discover -s tools -p 'test_entropy_tail_forms.py' -v
          python -m unittest discover -s tools -p 'test_noninterval_selection.py' -v
          python -m unittest discover -s tools -p 'test_program_factor.py' -v
          python -m unittest discover -s tools -p 'test_fixed_plan.py' -v
          python -m unittest discover -s tools -p 'test_oracle_sharpness.py' -v
          python -m unittest discover -s tools -p 'test_clipping_boundary.py' -v
          python -m unittest discover -s tools -p 'test_oracle_upper.py' -v
          python -m unittest discover -s tools -p 'test_clipped_output.py' -v
          python -m unittest discover -s tools -p 'test_confidence_transfer_steps.py' -v
          python -m unittest discover -s tools -p 'test_revisit_upper.py' -v
          python -m unittest discover -s tools -p 'test_observed_hoeffding.py' -v
          python -m unittest discover -s tools -p 'test_nested_assumptions.py' -v
      - name: Regression tests for the sharp RMS coefficient, large-budget bracket, upper-constant (119, 45, 36, 27, 19, 17, 15) and square-root cap audits
        run: |
          python -m unittest discover -s tools -p 'test_sharp_rms.py' -v
          python -m unittest discover -s tools -p 'test_large_budget_rms.py' -v
          python -m unittest discover -s tools -p 'test_pilot_feedback.py' -v
          python -m unittest discover -s tools -p 'test_explicit_constants.py' -v
          python -m unittest discover -s tools -p 'test_nonnegative_unbiased.py' -v
          python -m unittest discover -s tools -p 'test_upper_constant.py' -v
          python -m unittest discover -s tools -p 'test_upper_work.py' -v
          python -m unittest discover -s tools -p 'test_upper_moment.py' -v
          python -m unittest discover -s tools -p 'test_upper_mixture.py' -v
          python -m unittest discover -s tools -p 'test_upper_cost.py' -v
          python -m unittest discover -s tools -p 'test_upper_disagreement.py' -v
          python -m unittest discover -s tools -p 'test_upper_sign.py' -v
          python -m unittest discover -s tools -p 'test_upper_quarter.py' -v
          python -m unittest discover -s tools -p 'test_upper_scale.py' -v
          python -m unittest discover -s tools -p 'test_square_root_cap.py' -v
      - name: Regression tests for the whole-project axiom audit
        run: python -m unittest discover -s tools -p 'test_project_axioms.py' -v
      - name: Regression tests for the sign-neutral tail-test audit
        run: python -m unittest discover -s tools -p 'test_arbitrary_law_tail_test.py' -v
      - name: Regression tests for the capped tail-probe audit
        run: python -m unittest discover -s tools -p 'test_arbitrary_law_tail_probe.py' -v
      - name: Regression tests for the tail-median audit
        run: python -m unittest discover -s tools -p 'test_arbitrary_law_tail_median.py' -v
      - name: Regression tests for the tail-oracle audit
        run: python -m unittest discover -s tools -p 'test_arbitrary_law_tail_oracle.py' -v
      - name: Regression tests for the tail-observable audit
        run: python -m unittest discover -s tools -p 'test_arbitrary_law_tail_observable.py' -v
      - name: Regression tests for the pilot audit
        run: python -m unittest discover -s tools -p 'test_arbitrary_law_pilot.py' -v
      - name: Regression tests for the pilot-onset audit
        run: python -m unittest discover -s tools -p 'test_arbitrary_law_pilot_onset.py' -v
      - name: Regression tests for the learned-oracle audit
        run: python -m unittest discover -s tools -p 'test_arbitrary_law_learned_oracle.py' -v
      - name: Regression tests for the zero-quantile audit
        run: python -m unittest discover -s tools -p 'test_arbitrary_law_zero_quantile.py' -v
      - name: Regression tests for the known-law planner audit
        run: python -m unittest discover -s tools -p 'test_known_law_planner.py' -v
      - name: Regression tests for the plan-rate audit
        run: python -m unittest discover -s tools -p 'test_known_law_plan_rate.py' -v
      - name: Regression tests for the tight-rate audit
        run: python -m unittest discover -s tools -p 'test_known_law_plan_tight_rate.py' -v
      - name: Regression tests for the planner-output audit
        run: python -m unittest discover -s tools -p 'test_known_law_planner_output.py' -v
      - name: Regression tests for the planner-estimator audit
        run: python -m unittest discover -s tools -p 'test_known_law_planner_estimator.py' -v
      - name: Regression tests for the dyadic-summability audit
        run: python -m unittest discover -s tools -p 'test_dyadic_summability.py' -v
      - name: Regression tests for the robust-error audit
        run: python -m unittest discover -s tools -p 'test_robust_error_transfer.py' -v
      - name: Regression tests for the robust-work audit
        run: python -m unittest discover -s tools -p 'test_robust_coin_work.py' -v
      - name: Regression tests for the robust-level audit
        run: python -m unittest discover -s tools -p 'test_robust_level_certificates.py' -v
      - name: Regression tests for the robust-plan audit
        run: python -m unittest discover -s tools -p 'test_robust_plan.py' -v
      - name: Regression tests for the CDF-to-continuation audit
        run: python -m unittest discover -s tools -p 'test_robust_cdf_bridge.py' -v
      - name: Regression tests for clipping and pilot independence
        run: python -m unittest discover -s tools -p 'test_clipping_pilot_independence.py' -v
      - name: Regression tests for conditional capped-median coverage
        run: python -m unittest discover -s tools -p 'test_paid_median.py' -v
      - name: Regression tests for the arbitrary-law all-budget controller
        run: python -m unittest discover -s tools -p 'test_arbitrary_law_controller.py' -v
      - name: Regression tests for the quantile-model and upper-theorem audits
        run: |
          python -m unittest discover -s tools -p 'test_entropy_tail_components.py' -v
          python -m unittest discover -s tools -p 'test_entropy_tail_upper.py' -v
      - name: Regression tests for the stopping-program, cap-identification and genie audits
        run: |
          for test in stopping_program_lock stopping_components stopping_flow_mixture finite_stopping_program rarity_support stopping_dual information_bellman reference_absorption ordered_information adaptive_information stopping_program_upper finite_risk_certificate infinite_cap_dual genie_brackets genie_convergence genie_conic genie_counterexample; do
            python -m unittest discover -s tools -p "test_${test}.py" -v
          done
      - run: python tools/check_targets_numeric.py
      - name: Tier 2 numeric truth checks
        run: python tools/check_targets2_numeric.py
      - run: python tools/check_power_bracket.py
      - run: python proposals/constants/bias_audit.py
      - name: Check arithmetic for the paper constant
        run: python proposals/constants/uniform_constant_checks.py
      - name: Verify frozen hashes
        run: python tools/freeze.py --verify
      - name: Verify every hash-manifest lock, including lines deleted from FROZEN.sha256
        run: |
          python tools/verify_locks.py
          python -m unittest discover -s tools -p 'test_verify_locks.py' -v
      - name: Check accepted constants configuration
        run: |
          python constants/score_constants.py constants/candidate.json
          cp results/constants_last.json .runtime/drift/constants_candidate.json
          python constants/score_constants.py constants/candidate_theory.json
          cp results/constants_last.json .runtime/drift/constants_candidate_theory.json
          python constants/score_constants.py constants/candidate_finite_grid.json
      - name: Regression tests for the regenerated-record drift check
        run: python -m unittest discover -s tools -p 'test_results_drift.py' -v
      - name: Check regenerated records match the committed ones
        run: >-
          python tools/check_results_drift.py --rewritten-since .runtime/drift/start
          --extra .runtime/drift/constants_candidate.json=results/constants_theory.json
          --extra .runtime/drift/constants_candidate_theory.json=results/constants_theory.json
  lean-kernel:
    needs: lean-inputs
    if: ${{ !cancelled() && needs.lean-inputs.outputs.kernel != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean tool manager
        run: |
          # The installer downloads elan from GitHub releases, which can return transient 5xx errors.
          for attempt in 1 2 3; do
            if curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh" \
                && sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none; then
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Download pinned Mathlib cache
        working-directory: lean
        run: |
          for attempt in 1 2 3; do
            if lake exe cache get; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
      # Pull requests reuse the project's compiled modules from earlier runs of
      # this job on the same branch or on main. Lake still rebuilds every module
      # whose source, imports or toolchain changed: its traces hash them. Pushes
      # to main and manual runs build from scratch and refresh the cache. Lake's
      # per-module setup files, about 9 GB, are left out; it does not need them
      # to reuse a module.
      - name: Compute the build cache key
        id: build-key
        run: |
          echo "prefix=lean-build-v1-${{ github.job }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}-" >> "$GITHUB_OUTPUT"
          echo "sources=${{ hashFiles('lean/ThresholdHC.lean', 'lean/ThresholdHC/**/*.lean') }}" >> "$GITHUB_OUTPUT"
      - name: Restore compiled project modules
        id: build-cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: |
            lean/.lake/build
            !lean/.lake/build/ir/**/*.setup.json
          key: ${{ steps.build-key.outputs.prefix }}${{ steps.build-key.outputs.sources }}
          restore-keys: ${{ steps.build-key.outputs.prefix }}
      - name: Verify entropy perturbation and state compression against locked targets
        run: python tools/verify_selection_approximation.py
      - name: Verify the assembled finite-law approximation and original-objective certificate
        run: python tools/verify_finite_selection_approximation.py
      - name: Verify deterministic numerical certificates and actual toolkit outputs
        run: python tools/verify_deterministic_certificates.py
      - name: Check deterministic-certificate audit guards
        run: python -m unittest discover -s tools -p "test_deterministic_certificates_audit.py" -v
      - name: Verify finite-law measure bridges and actual objective/oracle outputs
        run: python tools/verify_finite_law_certificates.py
      - name: Check finite-law certificate audit guards
        run: python -m unittest discover -s tools -p "test_finite_law_certificates_audit.py" -v
      - name: Verify zero-residual envelopes and rounding/transfer output certificates
        run: python tools/verify_envelope_transfer_certificates.py
      - name: Check envelope/transfer certificate audit guards
        run: python -m unittest discover -s tools -p "test_envelope_transfer_certificates_audit.py" -v
      - name: Verify bounded global menu and solver output certificates
        run: python tools/verify_global_selection_certificates.py
      - name: Check global selection certificate audit guards
        run: python -m unittest discover -s tools -p "test_global_selection_certificates_audit.py" -v
      - name: Build sequentially and require complete kernel audit
        run: python tools/verify_lean_checkpoint.py --sequential
      - name: Verify unscored arithmetic for the paper bound
        run: python tools/verify_uniform_arithmetic.py
      - name: Require the complete uniform 713 theorem
        run: python tools/verify_uniform713.py --sequential --require-complete
      - name: Require the complete Tier 3 landmark
        run: python tools/verify_tier3.py --sequential --require-complete
      - name: Require the complete Tier 4 landmark
        run: python tools/verify_tier4.py --sequential --require-complete
      - name: Require the complete Tier 5 landmark
        run: python tools/verify_tier5.py --sequential --require-complete
      - name: Require the complete Tier 6 landmark
        run: python tools/verify_tier6.py --sequential --require-complete
      - name: Verify the locked separate-moment research bridge
        run: python lean/ThresholdHC/ResearchRouteA/verify.py
      - name: Verify the critical single-coin lower bound and scoped components
        run: python tools/verify_critical_components.py
      - name: Verify the full distribution-blind upper theorem
        run: python tools/verify_blind_upper_components.py
      - name: Verify the full critical upper theorem
        run: python tools/verify_critical_upper_components.py
      - name: Verify the actual critical Psi formula and minimax counterexample
        run: python tools/verify_critical_psi.py
      - name: Verify all-size entropy and explicit single-coin constants
        run: python tools/verify_critical_all_sizes.py
      - name: Verify the full observable unbiased converse
        run: python tools/verify_unbiased_converse.py
      - name: Verify the observable 713 construction and unbiased existence theorem
        run: python tools/verify_observable713.py
      - name: Verify the full observable confidence characterization
        run: python tools/verify_confidence.py
      - name: Verify the canonical magnitude-oracle lower bounds
        run: python tools/verify_oracle_lower.py
      # The audit builds its 54 modules; the seven window parts hold the 140
      # integer comparisons and compile in parallel. The replay re-evaluates
      # them in the independent kernel checker.
      - name: Verify the sharp universal RMS coefficient in all three models and replay its modules
        run: python tools/verify_sharp_rms.py --replay --jobs 3
      # The coefficient 1/6 is exact in the restricted settings of the rms-gap
      # note: budgets through four, both oracles there, and three flips per coin.
      - name: Verify the restricted-class RMS coefficient and replay its modules
        run: python tools/verify_restricted_rms.py --replay --jobs 3
      # The remark after Theorem sharp-rms: the bound omega/6 is strict for every
      # B >= 1 other than four, at every gap law and under both oracles.
      - name: Verify strictness of the sharp RMS bound away from B = 4 and replay its modules
        run: python tools/verify_sharp_strict.py --replay --jobs 3
      # The second rms-constants review: no magnitude-oracle upper coefficient
      # below one half, since small-gap point masses have oracle risk near 1/2.
      - name: Verify the sharpness of the oracle coefficient one half and replay its modules
        run: python tools/verify_oracle_sharpness.py --replay --jobs 3
      # The second rms-constants review: both oracle risks are at most half the
      # modulus at B^(-1/2), so one half is exactly the best oracle coefficient.
      - name: Verify the oracle upper bound with coefficient one half and replay its modules
        run: python tools/verify_oracle_upper.py --replay --jobs 3
      # Its 28 modules build on the sharp RMS modules above. The replay
      # re-evaluates the integer certificates of the five-bias test and the
      # pilot policy in the independent kernel checker.
      - name: Verify the large-budget bracket of the RMS coefficient and replay its modules
        run: python tools/verify_large_budget_rms.py --replay --jobs 3
      # The rms-constants package: the 20+5 revisit witness at the gap 1/5 with
      # a hard cap of 25 flips and RMS risk at most 0.188087. The replay
      # re-evaluates its integer risk certificate in the kernel checker.
      - name: Verify the 20+5 revisit witness and replay its modules
        run: python tools/verify_revisit_upper.py --replay --jobs 3
      # The pilot-feedback separations at gap 1/5, B = 25, promoted from two
      # research packages; the kernel replay re-evaluates their integer
      # certificates (about six minutes locally).
      - name: Verify the pilot-feedback separations and replay their modules
        run: python tools/verify_pilot_feedback.py --replay --jobs 3
      # Explicit constants that frozen statements leave existential: the
      # hidden-model confidence coefficient 15/(256 sqrt 2), the rare-event
      # lower coefficient 1/256 and the single-coin second moment 28 rho.
      - name: Verify the explicit constants and replay their modules
