name: Reproducible checks
on:
  push:
    paths:
      - '.github/workflows/checks.yml'
      - '.gitattributes'
      - 'README.md'
      - 'docs/**'
      - 'paper/**'
      - 'LICENSE*'
      - 'CITATION.cff'
      - 'lean/**'
      - 'tools/**'
      - 'constants/**'
      - 'benchmark/**'
      - 'results/**'
      - 'inputs/**'
      - 'requirements.txt'
      - 'FROZEN.sha256'
      - 'TIER3_FROZEN.sha256'
      - 'TIER4_FROZEN.sha256'
      - 'TIER5_FROZEN.sha256'
      - 'TIER6_FROZEN.sha256'
      - 'proposals/constants/*.lean'
      - 'proposals/constants/*.py'
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  numerical-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/verify_inputs.py
      - run: python tools/verify_experiment_lock.py
      - run: python benchmark/verify_real.py
      - name: Regression tests for validation guards
        run: python -m unittest discover -s tools -p 'test_validation.py' -v
      - name: Regression tests for the Tier 3 audit when present
        run: |
          if test -f tools/test_tier3_validation.py; then python -m unittest discover -s tools -p 'test_tier3_validation.py' -v; fi
      - name: Regression tests for the Tier 4 audit when present
        run: |
          if test -f tools/test_tier4_validation.py; then python -m unittest discover -s tools -p 'test_tier4_validation.py' -v; fi
      - name: Regression tests for the Tier 5 audit when present
        run: |
          if test -f tools/test_tier5_validation.py; then python -m unittest discover -s tools -p 'test_tier5_validation.py' -v; fi
      - name: Regression tests for the Tier 6 audit when present
        run: |
          if test -f tools/test_tier6_validation.py; then python -m unittest discover -s tools -p 'test_tier6_validation.py' -v; fi
      - run: python tools/check_targets_numeric.py
      - name: Tier 2 numeric truth checks when present
        run: |
          if test -f tools/check_targets2_numeric.py; then python tools/check_targets2_numeric.py; fi
      - run: python tools/check_power_bracket.py
      - run: python proposals/constants/bias_audit.py
      - name: Check arithmetic for the paper constant when available
        run: |
          if test -f proposals/constants/uniform_constant_checks.py; then python proposals/constants/uniform_constant_checks.py; fi
      - name: Verify frozen hashes when Phase 0 is complete
        run: |
          if test -f FROZEN.sha256; then python tools/freeze.py --verify; fi
      - name: Check accepted constants configuration
        run: |
          if test -f constants/candidate.json; then python constants/score_constants.py constants/candidate.json; fi
          python constants/score_constants.py constants/candidate_theory.json
          python constants/score_constants.py constants/candidate_finite_grid.json
  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean tool manager
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download pinned Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build sequentially and require complete kernel audit
        run: python tools/verify_lean_checkpoint.py --sequential
      - name: Verify unscored arithmetic for the paper bound
        run: python tools/verify_uniform_arithmetic.py
      - name: Require the complete uniform 713 theorem
        run: python tools/verify_uniform713.py --sequential --require-complete
      - name: Require the complete Tier 3 landmark when present
        run: |
          if test -f tools/verify_tier3.py; then python tools/verify_tier3.py --sequential --require-complete; fi
      - name: Require the complete Tier 4 landmark when present
        run: |
          if test -f tools/verify_tier4.py; then python tools/verify_tier4.py --sequential --require-complete; fi
      - name: Require the complete Tier 5 landmark when present
        run: |
          if test -f tools/verify_tier5.py; then python tools/verify_tier5.py --sequential --require-complete; fi
      - name: Require the complete Tier 6 landmark when present
        run: |
          if test -f tools/verify_tier6.py; then python tools/verify_tier6.py --sequential --require-complete; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-verification
          path: |
            results/lean_score.json
            results/lean_checkpoint.json
            results/lean_audit.log
            results/lean_independent_audit.log
            results/constants_uniform_lean_audit.log
            results/constants_uniform_lean_status.json
            results/uniform713_build.log
            results/uniform713_audit.log
            results/uniform713_status.json
            results/tier3_build.log
            results/tier3_audit.log
            results/tier3_status.json
            results/tier4_build.log
            results/tier4_audit.log
            results/tier4_status.json
            results/tier5_build.log
            results/tier5_audit.log
            results/tier5_status.json
            results/tier6_build.log
            results/tier6_audit.log
            results/tier6_status.json
