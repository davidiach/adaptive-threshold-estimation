name: Reproducible checks
on:
  push:
    paths:
      - '.github/workflows/checks.yml'
      - '.gitattributes'
      - 'README.md'
      - 'docs/**'
      - 'paper/**'
      - 'LICENSE*'
      - 'CITATION.cff'
      - 'lean/**'
      - 'tools/**'
      - 'constants/**'
      - 'benchmark/**'
      - 'results/**'
      - 'research/**'
      - 'inputs/**'
      - 'requirements.txt'
      - 'FROZEN.sha256'
      - 'TIER3_FROZEN.sha256'
      - 'TIER4_FROZEN.sha256'
      - 'TIER5_FROZEN.sha256'
      - 'TIER6_FROZEN.sha256'
      - 'proposals/constants/*.lean'
      - 'proposals/constants/*.py'
      - 'proposals/constants/*.md'
  pull_request:
  workflow_dispatch:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  research-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify research identities and replay finite diagnostics
        run: python tools/verify_research.py
      - name: Check research guard rejects tampering
        run: python -m unittest discover -s tools -p 'test_research_validation.py' -v
      - name: Verify the critical review packet matches its locked sources
        run: python tools/build_critical_review.py --check
      - name: Verify the consolidated manuscript and its inherited sources
        run: python tools/build_v5.py --check
      - name: Verify rare-event v2 identities and replay finite certificates
        run: python tools/verify_rare_event_manuscript.py
      - name: Check rare-event bracket rows bind verified certificate pairs
        run: python -m unittest discover -s tools -p 'test_rare_event_manuscript.py' -v
      - name: Check manuscript assembly preserves mathematical expressions
        run: python -m unittest discover -s tools -p 'test_build_v5.py' -v
      - name: Verify the consolidated v6 manuscript and its inherited sources
        run: python tools/build_v6.py --check
      - name: Check v6 assembly keeps both rare-event papers' proof text
        run: python -m unittest discover -s tools -p 'test_build_v6.py' -v
      - name: Replay population and nonlinear feedback checkpoints
        run: python tools/verify_population_research.py
      - name: Replay certified-selection evidence and compare with tracked records
        run: |
          python research/2026-10-30-certified-selection/verify_algebra.py
          python research/2026-10-30-certified-selection/reproduce.py
          python research/2026-10-30-certified-selection/integration-review/certify_obstruction.py
          python research/2026-10-30-certified-selection/integration-review/independent_check.py
      - name: Replay the exact hard-budget RMS fallback audits
        run: python research/2026-10-30-hard-budget-rms/verify.py
  numerical-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/verify_inputs.py
      - run: python tools/verify_experiment_lock.py --strict
      - run: python benchmark/verify_real.py
      - run: python benchmark/verify_production.py
      - name: Regression tests for validation guards
        run: python -m unittest discover -s tools -p 'test_validation.py' -v
      - name: Regression tests for the Tier 3 audit when present
        run: |
          if test -f tools/test_tier3_validation.py; then python -m unittest discover -s tools -p 'test_tier3_validation.py' -v; fi
      - name: Regression tests for the Tier 4 audit when present
        run: |
          if test -f tools/test_tier4_validation.py; then python -m unittest discover -s tools -p 'test_tier4_validation.py' -v; fi
      - name: Regression tests for the Tier 5 audit when present
        run: |
          if test -f tools/test_tier5_validation.py; then python -m unittest discover -s tools -p 'test_tier5_validation.py' -v; fi
      - name: Regression tests for the Tier 6 audit when present
        run: |
          if test -f tools/test_tier6_validation.py; then python -m unittest discover -s tools -p 'test_tier6_validation.py' -v; fi
      - name: Regression tests for the scoped critical component audit
        run: python -m unittest discover -s tools -p 'test_critical_components.py' -v
      - name: Regression tests for the upper theorem audit
        run: python -m unittest discover -s tools -p 'test_blind_upper_components.py' -v
      - name: Regression tests for the critical upper component audit
        run: python -m unittest discover -s tools -p 'test_critical_upper_components.py' -v
      - name: Regression tests for the critical Psi audit
        run: python -m unittest discover -s tools -p 'test_critical_psi.py' -v
      - name: Regression tests for the all-size critical extension audit
        run: python -m unittest discover -s tools -p 'test_critical_all_sizes.py' -v
      - name: Regression tests for the unbiased converse audit
        run: python -m unittest discover -s tools -p 'test_unbiased_converse.py' -v
      - name: Regression tests for the observable 713 audit
        run: python -m unittest discover -s tools -p 'test_observable713.py' -v
      - name: Regression tests for the observable confidence audit
        run: python -m unittest discover -s tools -p 'test_confidence.py' -v
      - name: Scan every project Lean source for proof escapes
        run: |
          python -m unittest discover -s tools -p 'test_lean_sources.py' -v
          python tools/verify_lean_sources.py
      - name: Regression tests for the magnitude-oracle lower bounds
        run: python -m unittest discover -s tools -p 'test_oracle_lower.py' -v
      - name: Regression tests for the above-two rare-event audit
        run: python -m unittest discover -s tools -p 'test_rare_above_two.py' -v
      - name: Regression tests for the entropy-tail audit
        run: python -m unittest discover -s tools -p 'test_entropy_tail.py' -v
      - name: Regression tests for the quantile-comparison audit
        run: python -m unittest discover -s tools -p 'test_quantile_comparison.py' -v
      - name: Regression tests for the quantile-model and upper-theorem audits
        run: |
          python -m unittest discover -s tools -p 'test_entropy_tail_components.py' -v
          python -m unittest discover -s tools -p 'test_entropy_tail_upper.py' -v
      - name: Regression tests for the stopping-program, cap-identification and genie audits
        run: |
          for test in stopping_program_lock stopping_components stopping_flow_mixture finite_stopping_program rarity_support stopping_dual information_bellman reference_absorption ordered_information adaptive_information stopping_program_upper finite_risk_certificate infinite_cap_dual genie_brackets genie_convergence genie_conic genie_counterexample; do
            python -m unittest discover -s tools -p "test_${test}.py" -v
          done
      - run: python tools/check_targets_numeric.py
      - name: Tier 2 numeric truth checks when present
        run: |
          if test -f tools/check_targets2_numeric.py; then python tools/check_targets2_numeric.py; fi
      - run: python tools/check_power_bracket.py
      - run: python proposals/constants/bias_audit.py
      - name: Check arithmetic for the paper constant when available
        run: |
          if test -f proposals/constants/uniform_constant_checks.py; then python proposals/constants/uniform_constant_checks.py; fi
      - name: Verify frozen hashes when Phase 0 is complete
        run: |
          if test -f FROZEN.sha256; then python tools/freeze.py --verify; fi
      - name: Check accepted constants configuration
        run: |
          if test -f constants/candidate.json; then python constants/score_constants.py constants/candidate.json; fi
          python constants/score_constants.py constants/candidate_theory.json
          python constants/score_constants.py constants/candidate_finite_grid.json
  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean tool manager
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download pinned Mathlib cache
        working-directory: lean
        run: |
          for attempt in 1 2 3; do
            if lake exe cache get; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Build sequentially and require complete kernel audit
        run: python tools/verify_lean_checkpoint.py --sequential
      - name: Verify unscored arithmetic for the paper bound
        run: python tools/verify_uniform_arithmetic.py
      - name: Require the complete uniform 713 theorem
        run: python tools/verify_uniform713.py --sequential --require-complete
      - name: Require the complete Tier 3 landmark when present
        run: |
          if test -f tools/verify_tier3.py; then python tools/verify_tier3.py --sequential --require-complete; fi
      - name: Require the complete Tier 4 landmark when present
        run: |
          if test -f tools/verify_tier4.py; then python tools/verify_tier4.py --sequential --require-complete; fi
      - name: Require the complete Tier 5 landmark when present
        run: |
          if test -f tools/verify_tier5.py; then python tools/verify_tier5.py --sequential --require-complete; fi
      - name: Require the complete Tier 6 landmark when present
        run: |
          if test -f tools/verify_tier6.py; then python tools/verify_tier6.py --sequential --require-complete; fi
      - name: Verify the locked separate-moment research bridge
        run: python lean/ThresholdHC/ResearchRouteA/verify.py
      - name: Verify the critical single-coin lower bound and scoped components
        run: python tools/verify_critical_components.py
      - name: Verify the full distribution-blind upper theorem
        run: python tools/verify_blind_upper_components.py
      - name: Verify the full critical upper theorem
        run: python tools/verify_critical_upper_components.py
      - name: Verify the actual critical Psi formula and minimax counterexample
        run: python tools/verify_critical_psi.py
      - name: Verify all-size entropy and explicit single-coin constants
        run: python tools/verify_critical_all_sizes.py
      - name: Verify the full observable unbiased converse
        run: python tools/verify_unbiased_converse.py
      - name: Verify the observable 713 construction and unbiased existence theorem
        run: python tools/verify_observable713.py
      - name: Verify the full observable confidence characterization
        run: python tools/verify_confidence.py
      - name: Verify the canonical magnitude-oracle lower bounds
        run: python tools/verify_oracle_lower.py
      - name: Verify the full observable above-two rare-event theory
        run: python tools/verify_rare_above_two.py --sequential
      - name: Verify the registered quantile-comparison target
        run: python tools/verify_quantile_comparison.py --sequential
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-verification
          include-hidden-files: true
          path: |
            results/lean_score.json
            results/lean_checkpoint.json
            results/lean_audit.log
            results/lean_independent_audit.log
            results/constants_uniform_lean_audit.log
            results/constants_uniform_lean_status.json
            results/uniform713_build.log
            results/uniform713_audit.log
            results/uniform713_status.json
            results/tier3_build.log
            results/tier3_audit.log
            results/tier3_status.json
            results/tier4_build.log
            results/tier4_audit.log
            results/tier4_status.json
            results/tier5_build.log
            results/tier5_audit.log
            results/tier5_status.json
            results/tier6_build.log
            results/tier6_audit.log
            results/tier6_status.json
            lean/ThresholdHC/ResearchRouteA/status.json
            lean/ThresholdHC/ResearchRouteA/build.log
            lean/ThresholdHC/ResearchRouteA/audit.log
            .runtime/critical-components/
            .runtime/blind-upper-components/
            .runtime/critical-upper-components/
            .runtime/critical-psi/
            .runtime/critical-all-sizes/
            .runtime/unbiased-converse/
            .runtime/observable713/
            .runtime/confidence/
            .runtime/oracle-lower/
            .runtime/rare-above-two/
            .runtime/quantile-comparison/
  entropy-tail-upper:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean tool manager
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download pinned Mathlib cache
        working-directory: lean
        run: |
          for attempt in 1 2 3; do
            if lake exe cache get; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Verify the registered entropy-tail targets, including the upper half
        run: python tools/verify_entropy_tail.py --sequential
      - name: Audit the observable entropy-tail and closed-quantile upper theorems
        run: python tools/verify_entropy_tail_upper.py --cached-dependencies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entropy-tail-verification
          include-hidden-files: true
          path: |
            .runtime/entropy-tail/
            .runtime/entropy-tail-upper/
  stopping-program:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean tool manager
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download pinned Mathlib cache
        working-directory: lean
        run: |
          for attempt in 1 2 3; do
            if lake exe cache get; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
      - name: Build the stopping-program, cap-identification and genie modules
        working-directory: lean
        run: lake build ThresholdHC.StoppingProgram.BellmanTheorem ThresholdHC.StoppingProgram.FiniteCertificate ThresholdHC.CapIdentification.FiniteSeparation ThresholdHC.CapIdentification.Full ThresholdHC.Genie.AtomConicRealization ThresholdHC.Genie.DirectRisk ThresholdHC.Genie.InfiniteDivergenceExample ThresholdHC.Genie.OptimizedConvergence
      - name: Audit the stopping-program, cap-identification and genie theorems
        run: |
          for audit in stopping_components stopping_flow_mixture finite_stopping_program rarity_support stopping_dual information_bellman reference_absorption ordered_information adaptive_information stopping_program_upper finite_risk_certificate infinite_cap_dual genie_brackets genie_convergence genie_conic genie_counterexample; do
            echo "::group::verify_${audit}.py"
            python tools/verify_${audit}.py --cached-dependencies
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stopping-program-verification
          include-hidden-files: true
          path: |
            .runtime/stopping-components/
            .runtime/stopping-flow-mixture/
            .runtime/finite-stopping-program/
            .runtime/rarity-support/
            .runtime/stopping-dual/
            .runtime/information-bellman/
            .runtime/reference-absorption/
            .runtime/ordered-information/
            .runtime/adaptive-information/
            .runtime/stopping-program-upper/
            .runtime/finite-risk-certificate/
            .runtime/infinite-cap-dual/
            .runtime/genie-brackets/
            .runtime/genie-convergence/
            .runtime/genie-conic/
            .runtime/genie-counterexample/
