[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "threshold-toolkit"
version = "0.1.0"
description = "Plan flip budgets and estimate the share of items that succeed more often than not."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[tool.setuptools]
packages = ["threshold_toolkit"]
